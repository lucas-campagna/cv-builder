$experiences:
  style: text-gray-700
  body:
    - from: row
      style_left: font-bold
      left: $company
      right: $date
    - from: row
      left: $position
      right: $type
    - from: div
      style: text-black
      body: $description

experience:
  body:
    - from: section
      title: Experience
    - from: div
      style: px-1 gap-2 flex flex-col
      body: experiences
