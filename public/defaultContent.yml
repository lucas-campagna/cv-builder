
row:
  style: flex justify-between
  body:
    - $left
    - $right

bulletPoint:
  from: li
  style: list-disc ml-5 my-1 text-base

section:
  from: h2
  style: text-lg font-bold uppercase tracking-widest border-b-2 border-gray-900 pb-1 mb-1
  body: $title

$experiences:
  body:
    - from: row
      left: $company
      right: $type
    - from: row
      left: $position
      right: $date
    - from: p
      body: $description


$headline:
  style: flex flex-col items-center pb-3
  body:
    - h1: $name
      style: text-2xl
    - from: div
      style: flex gap-2 text-xs pt-1
      body:
      - div: $email
      - div: $phone
      - div: $github
      - div: $linkedin

experience:
  body:
    - from: section
      title: Experience
    - from: div
      style: px-2
      body:
        - experiences

education:
  body:
    - from: section
      title: Education
    - from: div
      style: px-2
      body:
        - educations

$educations:
  body:
    - from: row
      left: $college
      right: $date
    - from: row
      left: $course
      right: $gpa
    - from: p
      body: $description

